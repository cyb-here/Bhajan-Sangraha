name: lyrics_app
description: Hybrid lyrics app with local bundle + remote JSON sync
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  supabase_flutter: ^2.8.0
  # sign_in_with_apple: (removed - not needed on Android)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/songs.json
